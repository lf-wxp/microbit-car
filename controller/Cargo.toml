[package]
name = "controller"
version = "0.0.0"
edition = "2024"

[dependencies]
embassy-executor.workspace = true
embassy-time.workspace = true
embassy-nrf.workspace = true
embassy-sync.workspace = true
embassy-futures.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe.workspace = true
static_cell.workspace = true
protocol.workspace = true
radio-core.workspace = true

[features]
# Default build uses the mock right-stick source so the fusion pipeline
# works end-to-end even without the second joystick wired up.
default = []

# Enable when the second joystick is physically wired up. Finish the
# `RightStickSource::new(...)` constructor in
# `src/joystick_right.rs` and the corresponding spawn site in
# `src/main.rs` before building with this feature.
right-stick-hw = []

[[bin]]
name = "controller"
bench = false
test = false
