# Makefile.toml - cargo-make configuration for microbit-car project
# Install: cargo install cargo-make
# Usage: cargo make build-all | cargo make flash-car | cargo make flash-controller

[config]
default_to_workspace = false

[env]
DEFMT_LOG = "debug"
CARGO_TARGET = "thumbv7em-none-eabihf"
CHIP = "nRF52833_xxAA"

# ============================================================
# Build tasks
# ============================================================

[tasks.build-all]
description = "Build all workspace members"
workspace = false
command = "cargo"
args = ["build", "--release"]

[tasks.build-car]
description = "Build car firmware"
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "car"]

[tasks.build-controller]
description = "Build controller firmware"
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "controller"]

[tasks.build-controller-rs]
description = "Build controller firmware with right-stick hardware enabled"
workspace = false
command = "cargo"
args = ["build", "--release", "-p", "controller", "--features", "right-stick-hw"]

[tasks.build-protocol]
description = "Build protocol library"
workspace = false
command = "cargo"
args = ["build", "-p", "protocol"]

# ============================================================
# Flash tasks (requires probe-rs)
# ============================================================

[tasks.flash-car]
description = "Flash car firmware to micro:bit"
workspace = false
dependencies = ["build-car"]
command = "probe-rs"
args = ["run", "--chip", "${CHIP}", "target/${CARGO_TARGET}/release/car"]

[tasks.flash-controller]
description = "Flash controller firmware to micro:bit"
workspace = false
dependencies = ["build-controller"]
command = "probe-rs"
args = ["run", "--chip", "${CHIP}", "target/${CARGO_TARGET}/release/controller"]

[tasks.flash-controller-rs]
description = "Flash controller firmware (right-stick hardware enabled) to micro:bit"
workspace = false
dependencies = ["build-controller-rs"]
command = "probe-rs"
args = ["run", "--chip", "${CHIP}", "target/${CARGO_TARGET}/release/controller"]

# ============================================================
# Development tasks
# ============================================================

[tasks.check]
description = "Check all workspace members for errors"
workspace = false
command = "cargo"
args = ["check", "--workspace"]

[tasks.clippy]
description = "Run clippy on all workspace members"
workspace = false
command = "cargo"
args = ["clippy", "--workspace", "--", "-D", "warnings"]

[tasks.fmt]
description = "Format all code"
workspace = false
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "Check code formatting"
workspace = false
command = "cargo"
args = ["fmt", "--all", "--check"]

# ============================================================
# Size analysis (requires cargo-binutils: cargo install cargo-binutils)
# ============================================================

[tasks.size-car]
description = "Show binary size of car firmware"
workspace = false
dependencies = ["build-car"]
command = "cargo"
args = ["size", "-p", "car", "--release", "--", "-A"]

[tasks.size-controller]
description = "Show binary size of controller firmware"
workspace = false
dependencies = ["build-controller"]
command = "cargo"
args = ["size", "-p", "controller", "--release", "--", "-A"]

# ============================================================
# Clean
# ============================================================

[tasks.clean]
description = "Clean build artifacts"
workspace = false
command = "cargo"
args = ["clean"]

# ============================================================
# Default task
# ============================================================

[tasks.default]
alias = "build-all"
workspace = false
